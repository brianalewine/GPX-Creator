<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:-apple-system,sans-serif}#notice{position:absolute;bottom:28px;left:12px;background:white;padding:10px 14px;border-radius:8px;z-index:1000;box-shadow:0 2px 12px #0002;display:none}.pin{border:2px solid #e58b22;border-radius:50%;background:white;width:12px;height:12px}.start{background:#32b66b}.auto{width:5px;height:5px;background:#89939d;border:1px solid white}.finish{font-size:22px;background:white;border-radius:6px}</style><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><div id="map"></div><div id="notice"></div><script>
let dashboardLines={},renderSignature='';
let map,provider='',layers=[],state={},coverageLayer,loadedKey='',googlePromise,fit='',cursor;
const send=(type,data={})=>window.webkit.messageHandlers.bridge.postMessage({type,...data});
function notice(s){let n=document.getElementById('notice');n.textContent=s;n.style.display=s?'block':'none'}
window.gm_authFailure=()=>notice('Google Maps could not authenticate this key. Check its API access and restrictions.');
function googleLoad(key){if(window.google?.maps)return Promise.resolve();if(googlePromise)return googlePromise;googlePromise=new Promise((resolve,reject)=>{window.initGoogle=resolve;let s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback=initGoogle&libraries=streetView&v=weekly';s.onerror=reject;document.head.append(s)});return googlePromise}
async function setup(s){let wanted=s.google?'google':'osm';if(provider===wanted&&map)return;provider=wanted;layers=[];cursor=null;document.getElementById('map').innerHTML='';if(map?.remove)map.remove();map=null;
 if(wanted==='google'){if(!s.key){notice('Add your Google Maps demo key in Settings.');return}try{await googleLoad(s.key);map=new google.maps.Map(document.getElementById('map'),{center:{lat:40.73,lng:-73.98},zoom:12,disableDoubleClickZoom:true,mapTypeControl:false,streetViewControl:true,fullscreenControl:false});coverageLayer=new google.maps.StreetViewCoverageLayer();map.addListener('click',e=>click(e.latLng.lat(),e.latLng.lng(),false));map.addListener('dblclick',e=>click(e.latLng.lat(),e.latLng.lng(),true));notice('')}catch(e){notice('Google Maps could not load. Check your connection and API key.')}}
 else {map=L.map('map',{doubleClickZoom:false}).setView([40.73,-73.98],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);map.on('click',e=>click(e.latlng.lat,e.latlng.lng,false));map.on('dblclick',e=>click(e.latlng.lat,e.latlng.lng,true));notice('')}
 fit='';}
let clickTimer;function click(lat,lng,finish){if(state.dashboard){send('select',{id:''});return}clearTimeout(clickTimer);if(finish)send('add',{lat,lng,finish:true});else clickTimer=setTimeout(()=>send('add',{lat,lng,finish:false}),230)}
function remove(l){provider==='google'?l.setMap(null):map.removeLayer(l)}
function line(points,color,width){let coords=points.map(p=>({lat:p.lat,lng:p.lng}));let l=provider==='google'?new google.maps.Polyline({map,path:coords,strokeColor:color,strokeWeight:width,strokeOpacity:1}):L.polyline(points.map(p=>[p.lat,p.lng]),{color,weight:width}).addTo(map);layers.push(l);return l}
function event(l,name,fn){if(provider==='google')l.addListener(name,fn);else l.on(name,fn)}
function coord(e){return provider==='google'?{lat:e.latLng.lat(),lng:e.latLng.lng()}:{lat:e.latlng.lat,lng:e.latlng.lng}}
function nearest(points,c){let best=null,d=Infinity;for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],dx=b.lng-a.lng,dy=b.lat-a.lat;let f=Math.max(0,Math.min(1,((c.lng-a.lng)*dx+(c.lat-a.lat)*dy)/(dx*dx+dy*dy||1)));let x=a.lng+f*dx,y=a.lat+f*dy,dist=(c.lng-x)**2+(c.lat-y)**2;if(dist<d){d=dist;best={lat:y,lng:x,time:a.time+f*(b.time-a.time)}}}return best}
function marker(p,index,total){let finish=state.finished&&index===total-1;let color=index===0?'#31b86a':p.manual?'white':'#89939d';let m;
if(provider==='google'){m=new google.maps.Marker({map,position:{lat:p.lat,lng:p.lng},draggable:p.manual,icon:{path:google.maps.SymbolPath.CIRCLE,scale:p.manual?7:3,fillColor:color,fillOpacity:1,strokeColor:p.manual?'#e78b24':'white',strokeWeight:2},label:finish?{text:'🏁',color:'#111',fontSize:'22px'}:undefined});event(m,'dragend',e=>send('move',{id:p.id,...coord(e)}));event(m,'rightclick',()=>send('delete',{id:p.id}));}
else{m=L.marker([p.lat,p.lng],{draggable:p.manual,icon:L.divIcon({className:'',html:finish?'<div class="finish">🏁</div>':'<div class="pin '+(index===0?'start':p.manual?'':'auto')+'"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);event(m,'dragend',()=>send('move',{id:p.id,lat:m.getLatLng().lat,lng:m.getLatLng().lng}));event(m,'contextmenu',e=>{L.DomEvent.stopPropagation(e);send('delete',{id:p.id})})}
event(m,'click',()=>{clearTimeout(clickTimer);send(finish?'unfinish':'seek',{time:p.time})});layers.push(m)}
window.update=async function(s){state=s;await setup(s);if(!map)return;let signature=JSON.stringify([s.google,s.key,s.dashboard,s.points,s.tracks,s.finished]);if(s.dashboard&&signature===renderSignature&&s.fit===fit){Object.entries(dashboardLines).forEach(([id,l])=>{let color=id===s.selected||id===s.hovered?'#f28b22':'#153c78';provider==='google'?l.setOptions({strokeColor:color}):l.setStyle({color})});if(coverageLayer)coverageLayer.setMap(s.coverage&&s.google?map:null);return}renderSignature=signature;dashboardLines={};layers.forEach(remove);layers=[];if(coverageLayer)coverageLayer.setMap(s.coverage&&s.google?map:null);
let all=[];if(s.dashboard){for(let t of s.tracks){all.push(...t.points);let l=line(t.points,t.id===s.selected||t.id===s.hovered?'#f28b22':'#153c78',5);dashboardLines[t.id]=l;event(l,'mouseover',()=>send('hover',{id:t.id}));event(l,'mouseout',()=>send('hover',{id:''}));event(l,'click',()=>send('select',{id:t.id}))}}
else{all=s.points;if(all.length>1){let l=line(all,'#ed8c25',4);event(l,'mousemove',e=>{let p=nearest(all,coord(e));if(p)send('preview',p)});event(l,'mouseout',()=>send('previewEnd'));event(l,'click',e=>{clearTimeout(clickTimer);let p=nearest(all,coord(e));if(p)send('insert',p)});event(l,'dblclick',e=>{clearTimeout(clickTimer);let p=nearest(all,coord(e));if(p)send('insert',{...p,finish:true})})}all.forEach((p,i)=>marker(p,i,all.length));}
if(s.fit&&fit!==s.fit&&all.length){fit=s.fit;let target=s.dashboard?(s.tracks.find(t=>t.id===s.fit)?.points||all):all;if(provider==='google'){let b=new google.maps.LatLngBounds();target.forEach(p=>b.extend({lat:p.lat,lng:p.lng}));let span=b.toSpan();let c=b.getCenter();b=new google.maps.LatLngBounds({lat:c.lat()-span.lat()*.7,lng:c.lng()-span.lng()*.7},{lat:c.lat()+span.lat()*.7,lng:c.lng()+span.lng()*.7});map.fitBounds(b,30)}else map.fitBounds(L.latLngBounds(target.map(p=>[p.lat,p.lng])).pad(.2),{maxZoom:18})}
window.cursorAt(s.cursor);};
window.cursorAt=function(p){if(cursor){remove(cursor);cursor=null}if(!p||!map)return;cursor=provider==='google'?new google.maps.Marker({map,position:p,icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#2389ee',fillOpacity:1,strokeColor:'white',strokeWeight:3},zIndex:999}):L.circleMarker([p.lat,p.lng],{radius:8,color:'white',weight:3,fillColor:'#2389ee',fillOpacity:1}).addTo(map)};
new ResizeObserver(()=>{if(!map)return;if(provider==='osm')map.invalidateSize();else google.maps.event.trigger(map,'resize')}).observe(document.getElementById('map'));
send('ready');
</script></body></html>
